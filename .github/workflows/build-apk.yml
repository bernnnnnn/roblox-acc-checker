name: Build APK

on:
  push:
    branches: [ "**" ]
  pull_request:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - name: Set up Android SDK
        uses: android-actions/setup-android@v3

      - name: Install SDK packages
        run: |
          yes | sdkmanager "platform-tools" "platforms;android-34" "build-tools;34.0.0" >/dev/null || true

      - name: Make gradlew executable
        run: chmod +x ./gradlew

      - name: Build debug APK
        run: ./gradlew assembleDebug --stacktrace --no-daemon

      - name: Rename APK
        run: cp app/build/outputs/apk/debug/app-debug.apk roblox-vault.apk

      - name: Upload APK artifact
        uses: actions/upload-artifact@v4
        with:
          name: roblox-vault-debug-apk
          path: roblox-vault.apk
          if-no-files-found: error

      - name: Publish to GitHub Release
        if: github.event_name != 'pull_request'
        uses: softprops/action-gh-release@v2
        with:
          tag_name: debug-latest
          name: Roblox Vault (latest debug build)
          prerelease: true
          body: |
            Latest debug build of Roblox Vault, built automatically from
            `${{ github.sha }}`.

            **Install:** download `roblox-vault.apk` below, tap it on your phone,
            and allow "install unknown apps" if prompted.
          files: roblox-vault.apk
